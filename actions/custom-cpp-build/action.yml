name: 'Custom C++ Build'
description: 'Assembles a C++ source file using a specific command'

inputs:
  source-file:
    description: 'The C++ source file to compile'
    required: true
  output-file:
    description: 'The output executable name'
    required: true
  compiler-flags:
    description: 'Additional compiler flags'
    required: false
    default: '-std=c++17'

runs:
  using: 'composite'
  steps:
    - name: Compile C++ Source
      shell: bash
      run: |
        echo "Compiling ${{ inputs.source-file }}"
        g++ -std=c++17 -Wall -Wextra -pedantic -Werror -g \
            ${{ inputs.source-dir }}/assembler.cpp \
            ${{ inputs.source-dir }}/z80_iset.cpp \
            ${{ inputs.source-dir }}/mos6502_iset.cpp \
            -o ${{ inputs.output-name }}
        echo "Build successful!"   
